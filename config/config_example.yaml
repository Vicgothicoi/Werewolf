#### Project Path Setting
# WORKSPACE_PATH: "Path for placing output files"

## 该文件重命名为config.yaml,然后填入你自己的API,必要时更换URLAPI_BASE和API_MODEL
#### LLM（DeepSeek，OpenAI 兼容接口）
OPENAI_API_BASE: "https://api.deepseek.com"
OPENAI_API_KEY: "YOUR_API_KEY"
OPENAI_API_MODEL: "deepseek-chat"
MAX_TOKENS: 1000
RPM: 30
TIMEOUT: 15 # Timeout for llm invocation
#OPENAI_PROXY: "socks5h://127.0.0.1:7890" # 你的本地代理，翻墙用 
#DEFAULT_PROVIDER: openai

#### Embedding（阿里云百炼，OpenAI 兼容接口）
EMBEDDING_API_BASE: "https://ws-rvu8x2d6v1w3u04j.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
EMBEDDING_API_KEY: "YOUR_EMBEDDING_API_KEY"
EMBEDDING_MODEL: "text-embedding-v4"
EMBEDDING_DIMENSIONS: 1024